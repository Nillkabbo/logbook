<script>
        // Simple tick timer logic for realism
        document.addEventListener("DOMContentLoaded", () => {
            const timerEl = document.getElementById('main-timer');
            if(timerEl) {
                let seconds = 12;
                setInterval(() => {
                    seconds++;
                    let s = seconds % 60;
                    let m = Math.floor(seconds / 60) + 47;
                    let h = 2 + Math.floor(m / 60);
                    m = m % 60;
                    
                    let sStr = s < 10 ? '0'+s : s;
                    let mStr = m < 10 ? '0'+m : m;
                    timerEl.innerText = `${h}:${mStr}:${sStr}`;
                }, 1000);
            }
        });
    </script>
