<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LogBook - Schedule</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary": "#003825",
                        "tertiary-fixed": "#ffdcc7",
                        "on-primary-container": "#00563b",
                        "surface-container-highest": "#2f3632",
                        "on-secondary-fixed": "#002114",
                        "on-background": "#dde4dd",
                        "surface-container-low": "#161d19",
                        "on-tertiary-fixed-variant": "#723600",
                        "surface-dim": "#0e1511",
                        "background": "#18181B", /* Canvas: #18181B */
                        "surface": "#27272A", /* Floating cards: #27272A */
                        "on-primary-fixed": "#002114",
                        "surface-tint": "#45dfa4",
                        "surface-container": "#1a211d",
                        "on-surface": "#FAFAFA", /* Primary text #FAFAFA */
                        "surface-variant": "#3F3F46", /* Inputs/Insets: #3F3F46 */
                        "surface-container-lowest": "#09100c",
                        "primary-fixed": "#68fcbf",
                        "outline": "rgba(250,250,250,0.6)", /* Secondary text */
                        "on-secondary-container": "#8cc1a5",
                        "on-primary": "#0B3B2E",
                        "inverse-primary": "#006c4b",
                        "error": "#F87171", /* Red #F87171 */
                        "surface-container-high": "#242c27",
                        "secondary": "#9dd2b6",
                        "tertiary-container": "#ffa668",
                        "primary-fixed-dim": "#45dfa4",
                        "primary-container": "#34D399", /* Emerald #34D399 */
                        "secondary-container": "#1c503a",
                        "inverse-surface": "#dde4dd",
                        "on-tertiary": "#502400",
                        "on-error": "#690005",
                        "inverse-on-surface": "#2b322e",
                        "primary": "#34D399", /* Emerald #34D399 */
                        "secondary-fixed": "#b8efd1",
                        "on-secondary-fixed-variant": "#1c503a",
                        "secondary-fixed-dim": "#9dd2b6",
                        "on-primary-fixed-variant": "#005137",
                        "outline-variant": "#3c4a42",
                        "on-tertiary-fixed": "#311300",
                        "on-error-container": "#ffdad6",
                        "on-tertiary-container": "#783901",
                        "on-surface-variant": "#bbcac0",
                        "error-container": "#93000a",
                        "tertiary": "#ffccad",
                        "tertiary-fixed-dim": "#ffb787",
                        "surface-bright": "#333b36"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "2xl": "12px",
                        "3xl": "24px",
                        "full": "9999px"
                    },
                    "spacing": {},
                    "fontFamily": {
                        "headline": [
                            "Inter", "system-ui", "sans-serif"
                        ],
                        "display": [
                            "Inter", "system-ui", "sans-serif"
                        ],
                        "body": [
                            "Inter", "system-ui", "sans-serif"
                        ],
                        "label": [
                            "Public Sans", "system-ui", "sans-serif"
                        ],
                        "mono": [
                            "ui-monospace", "SFMono-Regular", "Menlo", "Monaco", "Consolas", "Liberation Mono", "Courier New", "monospace"
                        ]
                    },
                    "boxShadow": {
                        'soft': '0 8px 24px rgba(0,0,0,0.4)',
                    }
                },
            },
        }
    </script>
<style>
        body {
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen pb-24 selection:bg-primary selection:text-on-primary">
<!-- Status Bar (Mock) -->
<div class="w-full h-12 flex items-center justify-between px-6 text-sm font-medium z-50 sticky top-0 bg-background/80 backdrop-blur-md">
<span class="tabular-nums">9:41</span>
<div class="flex gap-2">
<span class="material-symbols-outlined text-[18px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[18px]">wifi</span>
<span class="material-symbols-outlined text-[18px]">battery_full</span>
</div>
</div>
<!-- TopAppBar -->
<header class="w-full top-0 bg-background dark:bg-background flex items-center px-4 h-16 w-full sticky z-40">
<button class="w-10 h-10 flex items-center justify-center text-outline dark:text-outline hover:bg-surface-variant/50 dark:hover:bg-surface-variant/50 transition-colors duration-200 rounded-full mr-2">
<span class="material-symbols-outlined" data-icon="chevron_left">chevron_left</span>
</button>
<h1 class="font-headline text-[22px] font-bold text-on-surface dark:text-on-surface text-primary dark:text-primary">Settings</h1>
</header>
<!-- Main Content Canvas -->
<main class="px-4 pt-4 flex flex-col gap-6 max-w-lg mx-auto">
<!-- Work Blocks List -->
<section class="flex flex-col gap-4">
<!-- Card 1 -->
<div class="bg-surface rounded-3xl p-5 shadow-soft flex justify-between items-center group">
<p class="text-[14px] text-on-surface tabular-nums">Sun, Mon, Tue, Wed, Thu · 9:00 AM–5:00 PM</p>
<button class="text-error font-semibold text-[13px] opacity-80 hover:opacity-100 transition-opacity">Remove</button>
</div>
<!-- Card 2 -->
<div class="bg-surface rounded-3xl p-5 shadow-soft flex justify-between items-center group">
<p class="text-[14px] text-on-surface tabular-nums">Sat · 10:00 AM–2:00 PM</p>
<button class="text-error font-semibold text-[13px] opacity-80 hover:opacity-100 transition-opacity">Remove</button>
</div>
</section>
<!-- Add Block Section -->
<section class="bg-surface rounded-3xl p-6 shadow-soft flex flex-col gap-6">
<!-- Weekday Pill Row -->
<div class="flex justify-between items-center gap-1.5 overflow-x-auto pb-1 scrollbar-hide -mx-2 px-2">
<button class="flex-1 min-w-[36px] h-10 rounded-2xl flex items-center justify-center text-[13px] font-medium bg-primary text-on-primary">Su</button>
<button class="flex-1 min-w-[36px] h-10 rounded-2xl flex items-center justify-center text-[13px] font-medium bg-primary text-on-primary">Mo</button>
<button class="flex-1 min-w-[36px] h-10 rounded-2xl flex items-center justify-center text-[13px] font-medium bg-primary text-on-primary">Tu</button>
<button class="flex-1 min-w-[36px] h-10 rounded-2xl flex items-center justify-center text-[13px] font-medium bg-primary text-on-primary">We</button>
<button class="flex-1 min-w-[36px] h-10 rounded-2xl flex items-center justify-center text-[13px] font-medium bg-primary text-on-primary">Th</button>
<button class="flex-1 min-w-[36px] h-10 rounded-2xl flex items-center justify-center text-[13px] font-medium bg-surface-variant text-outline">Fr</button>
<button class="flex-1 min-w-[36px] h-10 rounded-2xl flex items-center justify-center text-[13px] font-medium bg-surface-variant text-outline">Sa</button>
</div>
<!-- Time Inputs -->
<div class="flex gap-4">
<div class="flex-1 flex flex-col gap-1.5">
<label class="text-[11px] font-semibold text-outline uppercase tracking-wider pl-1">From</label>
<div class="bg-surface-variant rounded-2xl h-14 flex items-center px-4 cursor-pointer hover:bg-surface-variant/80 transition-colors">
<span class="text-[16px] text-on-surface tabular-nums">9:00 AM</span>
</div>
</div>
<div class="flex-1 flex flex-col gap-1.5">
<label class="text-[11px] font-semibold text-outline uppercase tracking-wider pl-1">To</label>
<div class="bg-surface-variant rounded-2xl h-14 flex items-center px-4 cursor-pointer hover:bg-surface-variant/80 transition-colors">
<span class="text-[16px] text-on-surface tabular-nums">5:00 PM</span>
</div>
</div>
</div>
<!-- Action Button -->
<button class="w-full h-14 bg-primary text-on-primary rounded-3xl font-semibold text-[15px] hover:opacity-90 transition-opacity active:scale-[0.98]">
                Add block
            </button>
<!-- Hint Text -->
<p class="text-[12px] text-outline text-center px-2">
                Blocks nudge you to check in — they never clock you in automatically.
            </p>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center py-3 px-6 bg-surface-container dark:bg-surface-container shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)] rounded-t-xl block md:hidden">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:text-primary dark:hover:text-primary transition-all active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="font-label text-xs mt-1">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-5 py-1 hover:text-primary dark:hover:text-primary transition-all active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="schedule">schedule</span>
<span class="font-label text-xs mt-1">Logs</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container dark:text-on-primary-container rounded-full px-5 py-1 hover:text-primary dark:hover:text-primary transition-all active:scale-95 duration-150" href="#">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
<span class="font-label text-xs mt-1">Settings</span>
</a>
</nav>
</body></html>
