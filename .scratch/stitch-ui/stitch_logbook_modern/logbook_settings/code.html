<body class="bg-surface-canvas font-body-lg text-text-primary antialiased pb-24">
<!-- Status Bar Placeholder Area (9:41) -->
<div class="h-12 w-full pt-4 px-margin-mobile flex justify-between items-center text-[15px] font-semibold tracking-tight">
<span>9:41</span>
<div class="flex gap-2 items-center">
<span class="material-symbols-outlined text-[16px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="material-symbols-outlined text-[16px]" data-weight="fill" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<main class="px-margin-mobile flex flex-col gap-6 mt-6">
<!-- WEEK Section -->
<section>
<h2 class="text-[13px] uppercase tracking-wider text-text-secondary font-semibold mb-2 ml-2">WEEK</h2>
<div class="bg-surface-card rounded-[24px] shadow-ambient p-lg flex flex-col gap-6">
<div>
<label class="block text-[15px] mb-3">Week starts on</label>
<div class="flex flex-wrap gap-2">
<button class="bg-accent-emerald text-white rounded-full px-4 py-1.5 text-[14px] font-semibold transition-transform active:scale-95">Sun</button>
<button class="bg-surface-inset text-text-primary rounded-full px-4 py-1.5 text-[14px] font-medium transition-transform active:scale-95">Mon</button>
<button class="bg-surface-inset text-text-primary rounded-full px-4 py-1.5 text-[14px] font-medium transition-transform active:scale-95">Tue</button>
<button class="bg-surface-inset text-text-primary rounded-full px-4 py-1.5 text-[14px] font-medium transition-transform active:scale-95">Wed</button>
<button class="bg-surface-inset text-text-primary rounded-full px-4 py-1.5 text-[14px] font-medium transition-transform active:scale-95">Thu</button>
<button class="bg-surface-inset text-text-primary rounded-full px-4 py-1.5 text-[14px] font-medium transition-transform active:scale-95">Fri</button>
<button class="bg-surface-inset text-text-primary rounded-full px-4 py-1.5 text-[14px] font-medium transition-transform active:scale-95">Sat</button>
</div>
</div>
<div>
<label class="block text-[15px] mb-2">Weekly target (hours)</label>
<input class="w-full bg-surface-inset border-none rounded-[12px] px-4 py-3 text-text-primary focus:ring-2 focus:ring-accent-emerald font-numeric-data text-numeric-data" type="text" value="40"/>
</div>
<div>
<label class="block text-[15px] mb-2">Reminder threshold (hours, 1–16)</label>
<input class="w-full bg-surface-inset border-none rounded-[12px] px-4 py-3 text-text-primary focus:ring-2 focus:ring-accent-emerald font-numeric-data text-numeric-data mb-2" type="text" value="10"/>
<p class="text-[12px] text-text-secondary">Applies to your next check-in.</p>
</div>
</div>
</section>
<!-- EARNINGS Section -->
<section>
<h2 class="text-[13px] uppercase tracking-wider text-text-secondary font-semibold mb-2 ml-2">EARNINGS</h2>
<div class="bg-surface-card rounded-[24px] shadow-ambient p-lg flex flex-col gap-2">
<label class="block text-[15px] mb-2">Hourly rate ($, optional)</label>
<input class="w-full bg-surface-inset border-none rounded-[12px] px-4 py-3 text-text-primary focus:ring-2 focus:ring-accent-emerald font-numeric-data text-numeric-data mb-2" type="text" value="30"/>
<p class="text-[12px] text-text-secondary">When set, weeks show their earnings. Empty hides them.</p>
</div>
</section>
<!-- Navigation Card -->
<section>
<div class="bg-surface-card rounded-[24px] shadow-ambient flex flex-col">
<button class="flex items-center justify-between p-lg text-left hover:bg-surface-canvas/50 transition-colors rounded-t-[24px]">
<div>
<div class="text-[16px] text-text-primary">Schedule</div>
<div class="text-[13px] text-text-secondary mt-1">Sun–Thu · 9:00 AM–5:00 PM</div>
</div>
<span class="text-text-secondary text-2xl">›</span>
</button>
<div class="h-[1px] bg-surface-canvas mx-lg"></div>
<button class="flex items-center justify-between p-lg text-left hover:bg-surface-canvas/50 transition-colors rounded-b-[24px]">
<div>
<div class="text-[16px] text-text-primary">Data</div>
<div class="text-[13px] text-text-secondary mt-1">Export &amp; import</div>
</div>
<span class="text-text-secondary text-2xl">›</span>
</button>
</div>
</section>
<!-- LANGUAGE Section -->
<section>
<h2 class="text-[13px] uppercase tracking-wider text-text-secondary font-semibold mb-2 ml-2">LANGUAGE</h2>
<div class="bg-surface-card rounded-[24px] shadow-ambient p-lg">
<div class="flex gap-2">
<button class="bg-accent-emerald text-white rounded-full px-5 py-2 text-[14px] font-semibold transition-transform active:scale-95">System</button>
<button class="bg-surface-inset text-text-primary rounded-full px-5 py-2 text-[14px] font-medium transition-transform active:scale-95">English</button>
<button class="bg-surface-inset text-text-primary rounded-full px-5 py-2 text-[14px] font-medium transition-transform active:scale-95">বাংলা</button>
</div>
</div>
</section>
</main>
<!-- BottomNavBar -->
<nav class="md:hidden bg-surface dark:bg-surface-dim text-primary dark:text-primary-fixed font-label-md text-label-md fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/90 backdrop-blur-lg shadow-[0_-4px_16px_rgba(24,24,27,0.04)] fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-2 pb-6">
<button class="flex flex-col items-center justify-center text-text-secondary hover:bg-surface-container-low transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-xl">
<span class="material-symbols-outlined" data-icon="home">home</span>
<span class="mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-text-secondary hover:bg-surface-container-low transition-colors active:scale-90 transition-transform duration-200 p-2 rounded-xl">
<span class="material-symbols-outlined" data-icon="list_alt">list_alt</span>
<span class="mt-1">Logs</span>
</button>
<button class="flex flex-col items-center justify-center text-accent-emerald bg-accent-emerald-soft rounded-xl px-4 py-1 hover:bg-surface-container-low transition-colors active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined" data-icon="settings" data-weight="fill" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="mt-1 font-semibold">Settings</span>
</button>
</nav>
</body></html>
