<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LogBook - Home</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Public+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-variant": "#2f3632",
                        "outline": "#85948b",
                        "on-primary-fixed": "#002114",
                        "inverse-surface": "#dde4dd",
                        "on-secondary-fixed": "#002114",
                        "primary": "#5af0b3",
                        "tertiary-container": "#ffa668",
                        "surface-dim": "#0e1511",
                        "on-tertiary-container": "#783901",
                        "on-background": "#dde4dd",
                        "on-primary": "#003825",
                        "on-surface": "#dde4dd",
                        "primary-fixed-dim": "#45dfa4",
                        "on-error-container": "#ffdad6",
                        "surface": "#0e1511",
                        "on-tertiary-fixed-variant": "#723600",
                        "inverse-primary": "#006c4b",
                        "tertiary": "#ffccad",
                        "secondary-fixed-dim": "#9dd2b6",
                        "error": "#ffb4ab",
                        "surface-container-high": "#242c27",
                        "surface-container": "#1a211d",
                        "primary-container": "#34d399",
                        "surface-tint": "#45dfa4",
                        "error-container": "#93000a",
                        "secondary-container": "#1c503a",
                        "secondary": "#9dd2b6",
                        "on-secondary-fixed-variant": "#1c503a",
                        "on-error": "#690005",
                        "inverse-on-surface": "#2b322e",
                        "on-surface-variant": "#bbcac0",
                        "on-secondary": "#003825",
                        "tertiary-fixed": "#ffdcc7",
                        "primary-fixed": "#68fcbf",
                        "outline-variant": "#3c4a42",
                        "surface-bright": "#333b36",
                        "on-tertiary-fixed": "#311300",
                        "on-secondary-container": "#8cc1a5",
                        "on-primary-fixed-variant": "#005137",
                        "surface-container-lowest": "#09100c",
                        "on-primary-container": "#00563b",
                        "background": "#0e1511",
                        "secondary-fixed": "#b8efd1",
                        "tertiary-fixed-dim": "#ffb787",
                        "surface-container-highest": "#2f3632",
                        "on-tertiary": "#502400",
                        "surface-container-low": "#161d19"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "display": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Public Sans"]
                    }
                }
            }
        }
    </script>
<style>
        .font-tabular { font-variant-numeric: tabular-nums; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface dark:bg-surface text-on-surface font-body h-screen flex flex-col overflow-hidden select-none">
<!-- Status Bar (Simulated) -->
<div class="w-full flex justify-between items-center px-6 py-3 text-[15px] font-semibold text-white/90 z-50 shrink-0">
<div class="w-14">9:41</div>
<div class="flex items-center gap-1.5">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px] rotate-90">battery_full</span>
</div>
</div>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-4 pb-24 flex flex-col items-center">
<!-- Hero Button -->
<div class="mt-8 mb-12 flex justify-center w-full">
<button class="w-[220px] h-[220px] rounded-full bg-gradient-to-br from-primary-container to-primary flex items-center justify-center shadow-[0_0_40px_rgba(52,211,153,0.15)] active:scale-95 transition-transform duration-200 group">
<span class="text-[26px] font-bold text-on-primary-container group-hover:scale-105 transition-transform">Check in</span>
</button>
</div>
<!-- Totals Row -->
<div class="w-full max-w-md grid grid-cols-2 gap-4 mb-10">
<!-- Left: Today -->
<div class="flex flex-col">
<span class="text-[13px] font-label uppercase text-on-surface-variant tracking-wider font-semibold">TODAY</span>
<span class="text-[24px] font-semibold font-tabular text-on-surface mt-1">6:32</span>
</div>
<!-- Right: This Week -->
<div class="flex flex-col">
<span class="text-[13px] font-label uppercase text-on-surface-variant tracking-wider font-semibold">THIS WEEK</span>
<div class="flex items-baseline mt-1">
<span class="text-[34px] font-semibold font-tabular text-on-surface leading-none">32:40</span>
<span class="text-[20px] font-tabular text-on-surface-variant ml-1"> / 40:00</span>
</div>
<!-- Progress Bar -->
<div class="w-full h-2.5 bg-surface-container-high rounded-full mt-3 overflow-hidden">
<div class="h-full bg-primary-container rounded-full w-[82%]"></div>
</div>
<!-- Earnings -->
<span class="text-[15px] font-semibold font-tabular text-primary-container mt-2">$980.00</span>
</div>
</div>
<!-- Schedule Hint -->
<div class="w-full max-w-md text-center mb-6">
<span class="text-[13px] text-on-surface-variant">Next block: Mon, Aug 31, 9:00 AM</span>
</div>
<!-- Session Cards Container -->
<div class="w-full max-w-md flex flex-col gap-4">
<!-- Card 1 -->
<div class="bg-surface-container-high rounded-[24px] p-4 shadow-lg flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="text-[15px] text-on-surface">9:12 AM – 12:40 PM</span>
<span class="text-[15px] font-semibold font-tabular text-on-surface">3:28</span>
</div>
<div>
<span class="inline-flex items-center px-3 py-1 rounded-full bg-primary-container/15 text-primary-container text-[13px] font-medium">
                        Deep work
                    </span>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-container-high rounded-[24px] p-4 shadow-lg flex flex-col gap-3">
<div class="flex justify-between items-center">
<span class="text-[15px] text-on-surface">2:05 PM – 5:09 PM</span>
<span class="text-[15px] font-semibold font-tabular text-on-surface">3:04</span>
</div>
<div class="flex items-center gap-3">
<span class="inline-flex items-center px-3 py-1 rounded-full bg-primary-container/15 text-primary-container text-[13px] font-medium shrink-0">
                        Meetings
                    </span>
<span class="text-[13px] text-on-surface-variant truncate">Sprint planning + 1:1s</span>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-2 pb-6 bg-surface/90 backdrop-blur-lg shadow-[0_-4px_16px_rgba(24,24,27,0.04)] z-50 rounded-t-xl shrink-0 md:hidden">
<!-- Home (Active) -->
<button class="flex flex-col items-center justify-center text-primary bg-primary-container/10 rounded-xl px-4 py-1 hover:bg-surface-container-low transition-colors active:scale-90 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label text-xs mt-1">Home</span>
</button>
<!-- Logs -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 duration-200 px-4 py-1 rounded-xl">
<span class="material-symbols-outlined">list_alt</span>
<span class="font-label text-xs mt-1">Logs</span>
</button>
<!-- Settings -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-low transition-colors active:scale-90 duration-200 px-4 py-1 rounded-xl">
<span class="material-symbols-outlined">settings</span>
<span class="font-label text-xs mt-1">Settings</span>
</button>
</nav>
</body></html>
