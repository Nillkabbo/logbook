            background-color: theme('colors.surface-canvas');
            color: theme('colors.text-primary');

    body {
      min-height: max(884px, 100dvh);

<body class="flex flex-col min-h-screen relative font-body-md overflow-x-hidden pb-24">
<!-- Status Bar Spacer (Simulated) -->
<div class="h-12 w-full flex justify-between items-end px-6 pb-2 text-[15px] font-semibold tracking-tight text-text-primary">
<span>9:41</span>
<div class="flex items-center space-x-1">
<span class="material-symbols-outlined text-lg" data-icon="signal_cellular_4_bar" style="font-variation-settings: 'FILL' 1;">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-lg" data-icon="wifi" style="font-variation-settings: 'FILL' 1;">wifi</span>
<span class="material-symbols-outlined text-lg" data-icon="battery_full" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Top Navigation -->
<header class="flex items-center justify-between px-margin-mobile py-sm">
<button class="w-10 h-10 flex items-center justify-center text-text-secondary hover:text-text-primary transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="chevron_left">chevron_left</span>
</button>
<h1 class="text-[22px] font-bold tracking-tight text-text-primary">Data</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-margin-mobile py-sm space-y-md">
<!-- Export Section -->
<section class="bg-surface-card rounded-[24px] shadow-ambient p-lg space-y-md">
<button class="w-full bg-accent-emerald text-white rounded-[24px] py-4 px-6 text-center font-semibold text-body-lg flex justify-center items-center shadow-sm active:scale-[0.98] transition-transform">
                Export all sessions (CSV)
            </button>
<div class="space-y-unit text-[13px] text-text-secondary">
<p>One row per session via the share sheet.</p>
<p class="font-numeric-data">Last export: Jul 12, 2026</p>
</div>
</section>
<!-- Import Section -->
<section class="bg-surface-card rounded-[24px] shadow-ambient p-lg space-y-md">
<button class="w-full bg-surface-inset text-text-primary rounded-[24px] py-4 px-6 text-center font-semibold text-body-lg flex justify-center items-center active:scale-[0.98] transition-transform">
                Import backup (CSV)
            </button>
<div class="text-[13px] text-text-secondary">
<p>Merges a previous export — duplicates and running rows are skipped.</p>
</div>
</section>
</main>
<!-- Navigation Shell: BottomNavBar -->
<nav class="fixed bottom-0 w-full flex justify-around items-center px-margin-mobile pb-8 pt-2 bg-surface-canvas/80 backdrop-blur-md z-50 md:hidden border-t-0 shadow-none">
<!-- Home (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-200 p-2">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="home" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<!-- Logs (Inactive) -->
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-200 p-2">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="history" style="font-variation-settings: 'FILL' 0;">history</span>
<span class="font-label-md text-label-md">Logs</span>
</button>
<!-- Settings (Active) -->
<button class="flex flex-col items-center justify-center text-accent-emerald bg-accent-emerald-soft rounded-xl px-4 py-1 hover:opacity-80 transition-opacity scale-95 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-2xl mb-1" data-icon="settings" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-md text-label-md font-bold">Settings</span>
</button>
</nav>
