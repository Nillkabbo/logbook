<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LogBook - Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>

                        "tertiary": "#000000",
                        "outline-variant": "#c8c5cb",
                        "surface-canvas": "#F4F4F5",
                        "accent-emerald-soft": "rgba(5,150,105,0.1)",
                        "on-error": "#ffffff",
                        "surface-container-highest": "#e2e2e3",
                        "on-secondary-container": "#00714e",
                        "surface-container-low": "#f3f3f4",
                        "primary": "#000000",
                        "surface-variant": "#e2e2e3",
                        "surface-card": "#FFFFFF",
                        "secondary-fixed": "#85f8c4",
                        "secondary": "#006c4a",
                        "secondary-container": "#82f5c1",
                        "on-surface-variant": "#47464b",
                        "primary-fixed": "#e4e1e6",
                        "tertiary-fixed-dim": "#cbc6bd",
                        "on-tertiary-fixed-variant": "#494640",
                        "inverse-on-surface": "#f0f1f2",
                        "on-tertiary-fixed": "#1d1b16",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#002114",
                        "surface-container-high": "#e8e8e9",
                        "tertiary-fixed": "#e8e2d9",
                        "inverse-surface": "#2f3132",
                        "primary-fixed-dim": "#c8c5ca",

                        "surface-container": "#eeeeef",
                        "surface-dim": "#dadadb",

                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",

                    },
                    "spacing": {
                        "gutter": "20px",

<style>
        body { font-family: 'Inter', sans-serif; }
        .tabular-nums { font-variant-numeric: tabular-nums; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-canvas text-text-primary min-h-screen flex flex-col items-center">
<!-- Mobile Container (Max Width to simulate app on desktop) -->
<div class="w-full max-w-md bg-surface-canvas min-h-screen relative shadow-2xl overflow-hidden pb-24">
<!-- Status Bar -->
<div class="w-full h-12 flex justify-between items-center px-6 pt-2 z-50 relative">
<span class="font-numeric-data text-numeric-data font-semibold text-text-primary">9:41</span>
<div class="flex items-center space-x-1">
<span class="material-symbols-outlined text-[16px]">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px]">wifi</span>
<span class="material-symbols-outlined text-[16px] text-text-primary" style="font-variation-settings: 'FILL' 1;">battery_full</span>
</div>
</div>
<!-- Main Content Canvas -->
<main class="w-full px-margin-mobile flex flex-col items-center pt-8">
<!-- Hero Button -->
<div class="mt-8 mb-16 relative group cursor-pointer">
<div class="absolute inset-0 bg-gradient-to-br from-accent-emerald to-[#0D9488] rounded-full blur-xl opacity-40 group-hover:opacity-60 transition-opacity duration-300"></div>
<button class="relative w-[220px] h-[220px] rounded-full bg-gradient-to-br from-accent-emerald to-[#0D9488] shadow-[0_20px_40px_rgba(5,150,105,0.3)] flex flex-col items-center justify-center transform transition-transform duration-200 active:scale-95 group-hover:scale-[1.02]">
<span class="text-white text-[26px] font-bold tracking-tight">Check in</span>
</button>
</div>
<!-- Totals Row -->
<div class="w-full max-w-sm flex justify-center space-x-12 mb-10">
<!-- Left: Today -->
<div class="flex flex-col items-center">
<span class="text-[13px] font-medium text-text-secondary uppercase tracking-wider mb-1">TODAY</span>
<span class="text-[24px] font-semibold tabular-nums text-text-primary">6:32</span>
</div>
<!-- Vertical Divider (Subtle) -->
<div class="w-[1px] h-12 bg-surface-inset"></div>
<!-- Right: This Week -->
<div class="flex flex-col items-center">
<span class="text-[13px] font-medium text-text-secondary uppercase tracking-wider mb-1">THIS WEEK</span>
<div class="flex items-baseline space-x-1 mb-2">
<span class="text-[34px] font-semibold tabular-nums text-text-primary tracking-tight">32:40</span>
<span class="text-[20px] font-medium text-text-secondary tabular-nums">/ 40:00</span>
</div>
<!-- Progress & Earnings -->
<div class="w-full flex flex-col items-center mt-1">
<div class="w-32 h-[10px] bg-surface-inset rounded-full overflow-hidden mb-2">
<div class="h-full bg-accent-emerald rounded-full" style="width: 82%;"></div>
</div>
<span class="text-accent-emerald font-semibold tabular-nums text-[15px]">$980.00</span>
</div>
</div>
</div>
<!-- Next Block Muted Text -->
<p class="text-[13px] text-text-secondary text-center mb-8">Next block: Mon, Aug 31, 9:00 AM</p>
<!-- Today's Sessions -->
<div class="w-full flex flex-col space-y-4 w-full max-w-[380px]">
<!-- Card 1 -->
<div class="bg-surface-card rounded-[24px] p-lg shadow-[0_8px_24px_rgba(24,24,27,0.06)] flex flex-col space-y-4 transition-transform hover:-translate-y-1 duration-200">
<div class="flex justify-between items-center w-full">
<span class="text-[15px] text-text-primary font-medium">9:12 AM – 12:40 PM</span>
<span class="text-[15px] font-semibold tabular-nums text-text-primary">3:28</span>
</div>
<div>
<span class="inline-flex items-center justify-center bg-accent-emerald-soft text-accent-emerald px-3 py-1.5 rounded-full text-[13px] font-medium">Deep work</span>
</div>
</div>
<!-- Card 2 -->
<div class="bg-surface-card rounded-[24px] p-lg shadow-[0_8px_24px_rgba(24,24,27,0.06)] flex flex-col space-y-4 transition-transform hover:-translate-y-1 duration-200">
<div class="flex justify-between items-center w-full">
<span class="text-[15px] text-text-primary font-medium">2:05 PM – 5:09 PM</span>
<span class="text-[15px] font-semibold tabular-nums text-text-primary">3:04</span>
</div>
<div class="flex flex-col space-y-2">
<div class="flex items-center space-x-3">
<span class="inline-flex items-center justify-center bg-accent-emerald-soft text-accent-emerald px-3 py-1.5 rounded-full text-[13px] font-medium">Meetings</span>
<span class="text-[13px] text-text-secondary">Sprint planning + 1:1s</span>
</div>
</div>
</div>
</div>
</main>
<!-- Bottom NavBar (From JSON definition) -->
<nav class="fixed bottom-0 left-0 w-full max-w-md z-50 flex justify-around items-center px-margin-mobile pb-8 pt-4 shadow-[0_-8px_24px_rgba(24,24,27,0.06)] bg-surface-container-lowest dark:bg-surface-container-lowest rounded-t-xl" style="left: 50%; transform: translateX(-50%);">
<!-- Home (Active) -->
<div class="flex flex-col items-center justify-center text-accent-emerald dark:text-accent-emerald hover:opacity-100 transition-opacity cursor-pointer scale-95 duration-200 group">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="font-label-md text-label-md">Home</span>
</div>
<!-- Logs (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:opacity-100 transition-opacity cursor-pointer duration-200 group">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:scale-110 transition-transform">schedule</span>
<span class="font-label-md text-label-md">Logs</span>
</div>
<!-- Settings (Inactive) -->
<div class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-60 hover:opacity-100 transition-opacity cursor-pointer duration-200 group">
<span class="material-symbols-outlined text-[24px] mb-1 group-hover:scale-110 transition-transform">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</div>
</nav>
</div>
</body></html>
