<style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-canvas text-text-primary min-h-screen flex flex-col antialiased">
<!-- Status Bar (Simulated) -->
<div class="h-11 flex justify-between items-center px-6 pt-1 text-xs font-semibold shrink-0">
<span class="w-[54px] text-center">9:41</span>
<div class="flex items-center gap-1.5 w-[54px] justify-end">
<span class="material-symbols-outlined text-[16px] leading-none">signal_cellular_4_bar</span>
<span class="material-symbols-outlined text-[16px] leading-none">wifi</span>
<span class="material-symbols-outlined text-[16px] leading-none">battery_full</span>
</div>
</div>
<!-- Top App Bar -->
<header class="flex justify-between items-center px-margin-mobile h-16 w-full shrink-0">
<button class="w-10 h-10 flex items-center justify-center -ml-2 text-text-secondary active:scale-95 transition-transform">
<span class="material-symbols-outlined text-3xl">chevron_left</span>
</button>
<h1 class="text-[22px] font-bold tracking-tight">Schedule</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile pb-[100px] flex flex-col gap-4 overflow-y-auto">
<!-- Work Block 1 -->
<div class="bg-surface-card rounded-2xl p-4 shadow-[0_8px_24px_rgba(24,24,27,0.06)] flex justify-between items-center">
<span class="font-numeric-data text-numeric-data text-text-primary">Sun, Mon, Tue, Wed, Thu · 9:00 AM–5:00 PM</span>
<button class="text-[#DC2626] text-[13px] font-semibold active:opacity-70 transition-opacity">Remove</button>
</div>
<!-- Work Block 2 -->
<div class="bg-surface-card rounded-2xl p-4 shadow-[0_8px_24px_rgba(24,24,27,0.06)] flex justify-between items-center">
<span class="font-numeric-data text-numeric-data text-text-primary">Sat · 10:00 AM–2:00 PM</span>
<button class="text-[#DC2626] text-[13px] font-semibold active:opacity-70 transition-opacity">Remove</button>
</div>
<!-- Add a block form -->
<div class="bg-surface-card rounded-2xl p-lg shadow-[0_8px_24px_rgba(24,24,27,0.06)] flex flex-col gap-6 mt-2">
<!-- Weekday Pills -->
<div class="flex gap-2 justify-between">
<button class="flex-1 h-9 rounded-xl bg-accent-emerald text-white text-[13px] font-semibold flex items-center justify-center">Sun</button>
<button class="flex-1 h-9 rounded-xl bg-accent-emerald text-white text-[13px] font-semibold flex items-center justify-center">Mon</button>
<button class="flex-1 h-9 rounded-xl bg-accent-emerald text-white text-[13px] font-semibold flex items-center justify-center">Tue</button>
<button class="flex-1 h-9 rounded-xl bg-accent-emerald text-white text-[13px] font-semibold flex items-center justify-center">Wed</button>
<button class="flex-1 h-9 rounded-xl bg-accent-emerald text-white text-[13px] font-semibold flex items-center justify-center">Thu</button>
<button class="flex-1 h-9 rounded-xl bg-surface-inset text-text-primary text-[13px] font-medium flex items-center justify-center">Fri</button>
<button class="flex-1 h-9 rounded-xl bg-surface-inset text-text-primary text-[13px] font-medium flex items-center justify-center">Sat</button>
</div>
<!-- Time Inputs -->
<div class="flex gap-4">
<div class="flex-1 bg-surface-inset rounded-xl p-3 flex flex-col justify-center">
<span class="text-[11px] uppercase text-text-secondary font-medium tracking-wider mb-1">From</span>
<input class="bg-transparent border-none p-0 text-[16px] font-medium text-text-primary focus:ring-0 w-full" readonly="" type="text" value="9:00 AM"/>
</div>
<div class="flex-1 bg-surface-inset rounded-xl p-3 flex flex-col justify-center">
<span class="text-[11px] uppercase text-text-secondary font-medium tracking-wider mb-1">To</span>
<input class="bg-transparent border-none p-0 text-[16px] font-medium text-text-primary focus:ring-0 w-full" readonly="" type="text" value="5:00 PM"/>
</div>
</div>
<!-- Add Button -->
<button class="w-full h-12 bg-accent-emerald text-white rounded-2xl font-semibold text-[15px] active:scale-[0.98] transition-transform">
                Add block
            </button>
<!-- Hint -->
<p class="text-[12px] text-text-secondary text-center leading-relaxed">
                Blocks nudge you to check in — they never clock you in automatically.
            </p>
</div>
</main>
<!-- Bottom Nav Bar -->
<nav class="fixed bottom-0 left-0 w-full flex justify-around items-center px-4 pt-2 pb-8 bg-surface/90 backdrop-blur-lg shadow-[0_-4px_16px_rgba(24,24,27,0.04)] rounded-t-xl z-50">
<button class="flex flex-col items-center justify-center text-text-secondary w-16 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 0;">home</span>
<span class="font-label-md text-label-md">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-text-secondary w-16 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 0;">list_alt</span>
<span class="font-label-md text-label-md">Logs</span>
</button>
<button class="flex flex-col items-center justify-center text-accent-emerald bg-accent-emerald-soft rounded-xl px-4 py-1.5 active:scale-90 transition-transform duration-200">
<span class="material-symbols-outlined text-2xl mb-0.5" style="font-variation-settings: 'FILL' 1;">settings</span>
<span class="font-label-md text-label-md">Settings</span>
</button>
</nav>
</body></html>
